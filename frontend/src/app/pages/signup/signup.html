<h2 mat-dialog-title class="dialog-title">Create Account</h2>

<mat-dialog-content>

  <form
    [formGroup]="signupForm"
    (ngSubmit)="onSubmit()"
    class="signup-form">

    <!-- NAME -->
    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Full Name</mat-label>

      <input
        matInput
        formControlName="name"
        autocomplete="name">

      <mat-error
        *ngIf="
          signupForm.get('name')?.hasError('required') &&
          signupForm.get('name')?.touched
        ">

        Name is required

      </mat-error>

    </mat-form-field>


    <!-- EMAIL -->
    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Email</mat-label>

      <input
        matInput
        type="email"
        formControlName="email"
        autocomplete="email">

      <mat-error
        *ngIf="
          signupForm.get('email')?.hasError('required') &&
          signupForm.get('email')?.touched
        ">

        Email is required

      </mat-error>

      <mat-error
        *ngIf="
          signupForm.get('email')?.hasError('email') &&
          signupForm.get('email')?.dirty
        ">

        Enter a valid email

      </mat-error>

    </mat-form-field>


    <!-- PASSWORD -->
    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Password</mat-label>

      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
        autocomplete="new-password">

      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hidePassword = !hidePassword">

        <mat-icon>
          {{ hidePassword ? 'visibility_off' : 'visibility' }}
        </mat-icon>

      </button>

      <mat-error
        *ngIf="
          signupForm.get('password')?.hasError('required') &&
          signupForm.get('password')?.touched
        ">

        Password is required

      </mat-error>

      <mat-error
        *ngIf="
          signupForm.get('password')?.hasError('minlength') &&
          signupForm.get('password')?.dirty
        ">

        Minimum 8 characters required

      </mat-error>

    </mat-form-field>


    <!-- CONFIRM PASSWORD -->
    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Confirm Password</mat-label>

      <input
        matInput
        [type]="hideConfirmPassword ? 'password' : 'text'"
        formControlName="passwordConfirm"
        autocomplete="new-password">

      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hideConfirmPassword = !hideConfirmPassword">

        <mat-icon>
          {{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}
        </mat-icon>

      </button>

      <!-- REQUIRED -->
      <mat-error
        *ngIf="
          signupForm.get('passwordConfirm')?.hasError('required') &&
          signupForm.get('passwordConfirm')?.touched
        ">

        Confirm your password

      </mat-error>

      <!-- PASSWORD MISMATCH -->
<mat-error
  *ngIf="
    signupForm.get('passwordConfirm')?.hasError('passwordMismatch') &&
    signupForm.get('passwordConfirm')?.dirty
  ">

  Passwords do not match

</mat-error>

    </mat-form-field>


    <!-- BUTTON -->
<button
  mat-raised-button
  color="primary"
  class="full-width signup-btn"
  type="submit"
  [disabled]="signupForm.invalid || isLoading">

  <mat-progress-spinner
    *ngIf="isLoading"
    diameter="20"
    mode="indeterminate"
    class="spinner">

  </mat-progress-spinner>

  <span>
    {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
  </span>

</button>

  </form>


  <!-- LOGIN LINK -->
  <div class="login-link">

    Already have an account?

    <a
      href="javascript:void(0)"
      (click)="openLogin()">

      Login

    </a>

  </div>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close>

    Cancel

  </button>

</mat-dialog-actions>
